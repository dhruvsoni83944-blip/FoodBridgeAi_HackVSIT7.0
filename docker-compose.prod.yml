# ==============================================================================
# FoodBridge AI — Production Docker Compose
# ==============================================================================
version: '3.8'

services:
  # Managed/Self-hosted PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: foodbridge_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-foodbridge_db}
    volumes:
      - foodbridge_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-foodbridge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express.js REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodbridge_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-foodbridge_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-foodbridge_production_jwt_secret_key_32_chars_min}
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  # React 19 Frontend Web App (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: foodbridge_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

  # Python FastAPI Vision Microservice (Optional Secondary Service)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: foodbridge_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      AI_ENVIRONMENT: production

volumes:
  foodbridge_pgdata:
  backend_uploads:

